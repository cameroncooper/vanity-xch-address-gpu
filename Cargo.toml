[workspace]
resolver = "2"
members = [
    "crates/vanity-core",
    "crates/vanity-cli",
    "crates/vanity-gpu",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.77"
readme = "README.md"

[workspace.dependencies]
bech32 = "0.11"
bip39 = "2"
chia-bls = "0.45"
chia-puzzle-types = "0.45"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num_cpus = "1"
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
